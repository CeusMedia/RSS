name: CI

on:
  push:
    branches: [master, '*.x']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, libxml, mbstring
          coverage: ${{ matrix.php == '8.3' && 'xdebug' || 'none' }}
          tools: composer:v2

      - name: Remove dependencies not needed for testing
        # doc-creator is only used to create API docs
        run: composer remove --dev ceus-media/doc-creator --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Syntax check
        run: vendor/bin/parallel-lint src test demo

      - name: Coding style
        if: matrix.php == '8.3'
        run: vendor/bin/php-cs-fixer fix --config=tool/php-cs-fixer.php --dry-run --diff

      - name: PHPStan
        run: vendor/bin/phpstan analyse --configuration=tool/phpstan.neon --no-progress --memory-limit=1G

      - name: Unit tests
        if: matrix.php != '8.3'
        run: vendor/bin/phpunit --configuration tool/phpunit.xml --testsuite units --no-coverage

      - name: Unit tests with coverage
        if: matrix.php == '8.3'
        run: XDEBUG_MODE=coverage vendor/bin/phpunit --configuration tool/phpunit.xml --testsuite units --coverage-text

      - name: Mutation tests
        if: matrix.php == '8.3'
        run: XDEBUG_MODE=coverage vendor/bin/infection --configuration=tool/infection.json5 --threads=max --no-progress

      - name: Demos
        run: |
          php demo/create.php > /dev/null
          php demo/read.php > /dev/null
          php demo/combine.php > /dev/null
          php demo/errors.php > /dev/null
          php demo/podcast.php > /dev/null
          php demo/planet.php > /dev/null
          php demo/planet.php --feed > /dev/null
          php demo/notify.php > /dev/null
          php demo/filter.php > /dev/null

      - name: Upload coverage report
        if: matrix.php == '8.3' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: doc/Test/Coverage
          if-no-files-found: ignore

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, libxml, mbstring
          coverage: none
          tools: composer:v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tool/docs/requirements.txt

      - name: Remove dependencies not needed for documentation
        run: composer remove --dev ceus-media/doc-creator --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Install MkDocs
        run: tool/docs/docs.sh install

      - name: Generate API reference
        run: php tool/docs/generate-api.php

      - name: Build documentation
        run: tool/docs/docs.sh build

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: doc/Site
