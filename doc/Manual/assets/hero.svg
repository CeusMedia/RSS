<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice">
	<defs>
		<radialGradient id="glowA" cx="15%" cy="20%" r="45%">
			<stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
			<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="glowB" cx="88%" cy="85%" r="50%">
			<stop offset="0" stop-color="#7db9e8" stop-opacity=".45"/>
			<stop offset="1" stop-color="#7db9e8" stop-opacity="0"/>
		</radialGradient>
		<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
			<circle cx="2" cy="2" r="1.4" fill="#fff" fill-opacity=".14"/>
		</pattern>
		<g id="feed" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
			<path d="M-20 -4 a24 24 0 0 1 24 24"/>
			<path d="M-20 -22 a42 42 0 0 1 42 42"/>
			<circle cx="-16" cy="16" r="4" fill="#fff" stroke="none"/>
		</g>
		<g id="item" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
			<rect x="-40" y="-26" width="80" height="52" rx="6"/>
			<path d="M-28 -12 H28 M-28 0 H20 M-28 12 H8"/>
		</g>
		<g id="wave" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round">
			<path d="M-30 0 V0 M-18 -10 V10 M-6 -18 V18 M6 -8 V8 M18 -14 V14 M30 -4 V4"/>
		</g>
	</defs>
	<g fill="#fff">
		<path d="M0 0 L320 0 L180 160 Z" fill-opacity=".10"/>
		<path d="M320 0 L640 0 L470 130 Z" fill-opacity=".06"/>
		<path d="M180 160 L470 130 L330 300 Z" fill-opacity=".05"/>
		<path d="M640 0 L960 0 L800 150 Z" fill-opacity=".08"/>
		<path d="M960 0 L1200 0 L1200 140 Z" fill-opacity=".05"/>
		<path d="M470 130 L800 150 L620 320 Z" fill-opacity=".04"/>
		<path d="M800 150 L1200 140 L1010 330 Z" fill-opacity=".05"/>
		<path d="M0 160 L180 160 L0 420 Z" fill-opacity=".04"/>
		<path d="M330 300 L620 320 L480 420 Z" fill-opacity=".03"/>
		<path d="M1010 330 L1200 300 L1200 420 Z" fill-opacity=".04"/>
	</g>
	<rect width="1200" height="420" fill="url(#dots)"/>
	<rect width="1200" height="420" fill="url(#glowA)"/>
	<rect width="1200" height="420" fill="url(#glowB)"/>
	<!--  feeds flowing together  -->
	<g fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round" stroke-opacity=".35">
		<path d="M-20 330 C 180 250, 260 380, 430 300 S 700 120, 900 190 S 1120 90, 1230 40"/>
		<path d="M-20 90 C 120 140, 230 40, 360 80"/>
		<path d="M860 400 C 960 330, 1060 360, 1230 280"/>
	</g>
	<!--  feed symbols  -->
	<g opacity=".22">
		<use href="#feed" transform="translate(110 300) rotate(-12) scale(1.1)"/>
		<use href="#feed" transform="translate(1080 110) rotate(10) scale(1.5)"/>
		<use href="#feed" transform="translate(960 330) rotate(-6) scale(.8)"/>
		<use href="#feed" transform="translate(240 80) rotate(8) scale(.7)"/>
	</g>
	<g opacity=".12">
		<use href="#feed" transform="translate(1160 260) rotate(-14) scale(.6)"/>
		<use href="#feed" transform="translate(40 170) rotate(16) scale(.55)"/>
	</g>
	<!--  items and audio  -->
	<g opacity=".28">
		<use href="#item" transform="translate(1100 40) rotate(-8) scale(.7)"/>
		<use href="#item" transform="translate(300 360) rotate(6) scale(.6)"/>
		<use href="#wave" transform="translate(760 60) rotate(-4) scale(.9)"/>
		<use href="#wave" transform="translate(560 380) rotate(5) scale(.7)"/>
	</g>
</svg>
